const PLAN_STORAGE_KEY = "gpuDashboardSlotPlans_v1";
const CODE_TO_ROOM = Object.fromEntries(
  Object.entries(ROOM_META).map(([room, m]) => [m.code, room])
);

// 선택된 랙 키("홍릉-25") 집합 → URL용 짧은 코드 문자열("HR25-YJ6-…")
function encodePlan(keys) {
  return Array.from(keys)
    .map((k) => {
      const [room, id] = k.split("-");
      const code = ROOM_META[room] ? ROOM_META[room].code : null;
      return code ? `${code}${id}` : null;
    })
    .filter(Boolean)
    .sort()
    .join("-");
}

// 코드 문자열 → 랙 키 배열 (알 수 없는 토큰은 무시)
function decodePlan(str) {
  const keys = [];
  if (!str) return keys;
  str.split("-").forEach((tok) => {
    const m = /^([A-Z]{2})(\d+)$/.exec(tok);
    if (!m) return;
    const room = CODE_TO_ROOM[m[1]];
    if (room) keys.push(`${room}-${m[2]}`);
  });
  return keys;
}
const ROOM_CAPACITY = {
  "홍릉": { coolingKW: 316, rackCount: 25, kwPerRack: 12.64, maxServersPerRack: 4 },
  "양재": { coolingKW: 560, rackCount: 32, kwPerRack: 17.5, maxServersPerRack: 6 },
  "대전": { coolingKW: 116, rackCount: 15, kwPerRack: 7.7, maxServersPerRack: 2.5 },
};

// 학과 전체 용량 합계 (인프라 랙 제외) — 정책 기준선 계산용
// ※ ROOM_CAPACITY 정의 이후에 와야 함 (즉시 실행되므로 TDZ 주의)
const DEPT_TOTAL = (() => {
  let racks = 0, slots = 0, physical = 0;
  RACK_DATA.forEach((r) => {
    if (r.infra) return;
    racks += 1;
    const cap = ROOM_CAPACITY[r.room];
    if (cap) slots += cap.maxServersPerRack;
    physical += PHYSICAL_SLOTS_PER_RACK;
  });
  return { racks, slots, physical };
})();

// 랙 부하 수준: 권장 최대 대비 현재 서버 수
function rackLoad(r) {
  const cap = ROOM_CAPACITY[r.room];
  if (!cap || r.infra || r.serverCount <= 0) {
    return { level: "none", ratio: 0, max: cap ? cap.maxServersPerRack : 0 };
  }
  const ratio = r.serverCount / cap.maxServersPerRack;
  let level = "ok";
  if (ratio > 1) level = "over";
  else if (ratio >= 0.8) level = "near";
  return { level, ratio, max: cap.maxServersPerRack };
}

function aggregateByOwner() {
  const map = {};
  RACK_DATA.forEach((r) => {
    if (r.shared || r.infra) return;
    const key = r.labActual;
    if (!map[key]) {
      map[key] = { owner: key, totalRacks: 0, totalServers: 0, byRoom: {}, flags: new Set(), nominals: new Set() };
    }
    const o = map[key];
    o.totalRacks += 1;
    o.totalServers += r.serverCount;
    o.byRoom[r.room] = o.byRoom[r.room] || { racks: 0, servers: 0 };
    o.byRoom[r.room].racks += 1;
    o.byRoom[r.room].servers += r.serverCount;
    if (r.labNominal !== r.labActual) o.nominals.add(r.labNominal);
    if (statusOf(r) === "reclaim") o.flags.add("reclaim");
    if (statusOf(r) === "empty") o.flags.add("empty");
  });
  return Object.values(map);
}

function SummaryCard({ room }) {

  const empty = racks.filter((r) => statusOf(r) === "empty").length;

  const servers = racks.reduce((s, r) => s + r.serverCount, 0);

function CapacityBanner() {

function GPUDashboard() {
  const [roomFilter, setRoomFilter] = useState("전체");
  const [statusFilter, setStatusFilter] = useState("전체");
  const [query, setQuery] = useState("");
  const [sortKey, setSortKey] = useState("rack");
  const [selected, setSelected] = useState(null);
  const [view, setView] = useState("rack");
  const [selectedLab, setSelectedLab] = useState(null);
  const [labSortKey, setLabSortKey] = useState("racks-desc");

  const candidateKeys = useMemo(
    () =>
      RACK_DATA.filter((r) => !r.shared && !r.infra && (r.reclaimable || r.empty)).map(
        (r) => `${r.room}-${r.rackId}`
      ),
    []
  );
  const sharedKeys = useMemo(
    () => RACK_DATA.filter((r) => r.shared).map((r) => `${r.room}-${r.rackId}`),
    []
  );
  const [slotSelection, setSlotSelection] = useState(() => new Set(candidateKeys));
  const [slotShowAll, setSlotShowAll] = useState(false);

  const toggleSlot = (key) => {
    setSlotSelection((prev) => {
      const next = new Set(prev);
      if (next.has(key)) next.delete(key);
      else next.add(key);
      return next;
    });
  };

  // ---- 슬롯 확보 플랜 저장/불러오기/공유 ----
  const [planName, setPlanName] = useState("");
  const [savedPlans, setSavedPlans] = useState(() => {
    try {
      const raw = localStorage.getItem(PLAN_STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  });
  const [shareMsg, setShareMsg] = useState("");

  // 라이트/다크 테마 (브라우저에 선택 저장)
  const [theme, setTheme] = useState(() => {
    try {
      return localStorage.getItem("gpuDashboardTheme") || "dark";
    } catch (e) {
      return "dark";
    }
  });
  useEffect(() => {
    try {
      localStorage.setItem("gpuDashboardTheme", theme);
    } catch (e) {
      /* 저장 불가 시 무시 */
    }
    // 오버스크롤 시 드러나는 body 배경도 테마에 맞춤
    const bg = theme === "light" ? "#F4F6F9" : "#0A0C10";
    document.body.style.background = bg;
    document.documentElement.style.background = bg;
  }, [theme]);
  const toggleTheme = () => setTheme((t) => (t === "dark" ? "light" : "dark"));

  // 최초 로드 시 URL 해시(#plan=...)에 담긴 선택을 복원
  useEffect(() => {
    const m = /[#&]plan=([^&]+)/.exec(window.location.hash);
    if (!m) return;
    const keys = decodePlan(decodeURIComponent(m[1]));
    if (keys.length) {
      setSlotSelection(new Set(keys));
      setView("slot");
    }
  }, []);

  const persistPlans = (plans) => {
    setSavedPlans(plans);
    try {
      localStorage.setItem(PLAN_STORAGE_KEY, JSON.stringify(plans));
    } catch (e) {
      /* localStorage 사용 불가 시 무시 (세션 한정) */
    }
  };

  const savePlan = () => {
    const name = planName.trim();
    if (!name) return;
    const entry = { name, keys: Array.from(slotSelection), ts: Date.now() };
    const others = savedPlans.filter((p) => p.name !== name);
    persistPlans([entry, ...others].sort((a, b) => b.ts - a.ts));
    setPlanName("");
  };

  const applyPlan = (plan) => setSlotSelection(new Set(plan.keys));

  const deletePlan = (name) => persistPlans(savedPlans.filter((p) => p.name !== name));

  const copyShareLink = () => {
    const encoded = encodePlan(slotSelection);
    const url = `${window.location.origin}${window.location.pathname}#plan=${encoded}`;
    const done = () => {
      setShareMsg("링크 복사됨");
      setTimeout(() => setShareMsg(""), 2000);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(url).then(done).catch(() => window.prompt("아래 링크를 복사하세요", url));
    } else {
      window.prompt("아래 링크를 복사하세요", url);
    }
  };

  const filtered = useMemo(() => {
    let rows = RACK_DATA.slice();
    if (roomFilter !== "전체") rows = rows.filter((r) => r.room === roomFilter);
    if (statusFilter !== "전체") rows = rows.filter((r) => statusOf(r) === statusFilter);
    if (query.trim()) {
      const q = query.trim().toLowerCase();
      rows = rows.filter(
        (r) =>
          r.labActual.toLowerCase().includes(q) ||
          r.labNominal.toLowerCase().includes(q)
      );
    }
    if (sortKey === "rack") {
      rows.sort((a, b) => (a.room === b.room ? a.rackId - b.rackId : ROOMS.indexOf(a.room) - ROOMS.indexOf(b.room)));
    } else if (sortKey === "servers-desc") {
      rows.sort((a, b) => b.serverCount - a.serverCount);
    } else if (sortKey === "servers-asc") {
      rows.sort((a, b) => a.serverCount - b.serverCount);
    } else if (sortKey === "lab") {
      rows.sort((a, b) => a.labActual.localeCompare(b.labActual, "ko"));
    }
    return rows;
  }, [roomFilter, statusFilter, query, sortKey]);

  const grouped = useMemo(() => {
    const g = {};
    filtered.forEach((r) => {
      g[r.room] = g[r.room] || [];
      g[r.room].push(r);
    });
    return g;
  }, [filtered]);

  const totalServers = RACK_DATA.reduce((s, r) => s + r.serverCount, 0);

  const slotSummary = useMemo(() => {
    const chosen = RACK_DATA.filter((r) => slotSelection.has(`${r.room}-${r.rackId}`));
    const byRoom = {};
    ROOMS.forEach((room) => (byRoom[room] = { racks: 0, servers: 0, slots: 0, physical: 0 }));
    let displaced = 0;
    let sharedRacks = 0;
    let sharedServers = 0;
    let totalSlots = 0;
    chosen.forEach((r) => {
      const perRack = (ROOM_CAPACITY[r.room] && ROOM_CAPACITY[r.room].maxServersPerRack) || 0;
      byRoom[r.room].racks += 1;
      byRoom[r.room].servers += r.serverCount;
      byRoom[r.room].slots += perRack;
      byRoom[r.room].physical += PHYSICAL_SLOTS_PER_RACK;
      totalSlots += perRack;
      if (r.serverCount > 0) displaced += r.serverCount;
      if (r.shared) {
        sharedRacks += 1;
        sharedServers += r.serverCount;
      }
    });
    return {
      totalRacks: chosen.length,
      byRoom,
      displacedServers: displaced,
      sharedRacks,
      sharedServers,
      labRacks: chosen.length - sharedRacks,
      totalSlots,
      netSlots: totalSlots - displaced,
      physicalSlots: chosen.length * PHYSICAL_SLOTS_PER_RACK,
    };
  }, [slotSelection]);

  const slotRows = useMemo(() => {
    let rows = RACK_DATA.filter((r) => !r.infra);
    if (!slotShowAll) {
      rows = rows.filter(
        (r) => r.reclaimable || r.empty || r.shared || slotSelection.has(`${r.room}-${r.rackId}`)
      );
    }
    if (query.trim()) {
      const q = query.trim().toLowerCase();
      rows = rows.filter((r) => r.labActual.toLowerCase().includes(q) || r.labNominal.toLowerCase().includes(q));
    }
    rows.sort((a, b) => (a.room === b.room ? a.rackId - b.rackId : ROOMS.indexOf(a.room) - ROOMS.indexOf(b.room)));
    return rows;
  }, [slotShowAll, slotSelection, query]);

  const allLabs = useMemo(() => aggregateByOwner(), []);
  const labAvg = useMemo(() => {
    const n = allLabs.length || 1;
    const totalRacks = allLabs.reduce((s, l) => s + l.totalRacks, 0);
    const totalSrv = allLabs.reduce((s, l) => s + l.totalServers, 0);
    return { racks: totalRacks / n, servers: totalSrv / n, count: allLabs.length };
  }, [allLabs]);

  const filteredLabs = useMemo(() => {
    let labs = allLabs.slice();
    if (query.trim()) {
      const q = query.trim().toLowerCase();
      labs = labs.filter((l) => l.owner.toLowerCase().includes(q));
    }
    if (labSortKey === "racks-desc") labs.sort((a, b) => b.totalRacks - a.totalRacks);
    else if (labSortKey === "servers-desc") labs.sort((a, b) => b.totalServers - a.totalServers);
    else if (labSortKey === "delta-desc") labs.sort((a, b) => (b.totalRacks - labAvg.racks) - (a.totalRacks - labAvg.racks));
    else if (labSortKey === "name") labs.sort((a, b) => a.owner.localeCompare(b.owner, "ko"));
    return labs;
  }, [allLabs, query, labSortKey, labAvg]);

  return (
    <div className="dash-root" data-theme={theme}>
      <style>{`

          --bg: #0A0C10;
          --panel: #11141B;
          --panel2: #161A23;

          )}
          <div className="plan-hint">
            저장 위치: 이 브라우저(localStorage) · 공유 링크는 선택 내용을 URL에 담아 다른 기기·동료와 공유합니다
          </div>
        </div>
      )}


      <div className="content">
        {view === "rack" ? (
          <>
            <div>
              {ROOMS.filter((room) => grouped[room] && grouped[room].length > 0).map((room) => (
                <div className="room-block" key={room}>
                  <div className="room-block-title">
                    {ROOM_META[room].full} · {grouped[room].length}개 표시중
                  </div>
                  <div className="rack-grid">
                    {grouped[room].map((rack) => (
                      <RackElevation
                        key={`${rack.room}-${rack.rackId}`}
                        rack={rack}
                        onSelect={setSelected}
                        selected={
                          selected &&
                          selected.room === rack.room &&
                          selected.rackId === rack.rackId
                        }
                      />
                    ))}
                  </div>
                </div>
              ))}
              {filtered.length === 0 && (
                <div className="detail-placeholder">조건에 맞는 랙이 없습니다.</div>
              )}
            </div>
            {selected ? (
              <DetailPanel rack={selected} onClose={() => setSelected(null)} />
            ) : (
              <div className="detail-placeholder">랙을 클릭하면 상세 정보가 여기에 표시됩니다.</div>
            )}
          </>
        ) : view === "lab" ? (
          <>
            <div>
              <div className="room-block-title">
                교수별 3개 서버실 총 사용량 · {filteredLabs.length}명 표시중 (점선 = 평균 {labAvg.racks.toFixed(1)}랙)
              </div>
              <div className="lab-grid">
                {filteredLabs.map((lab) => (
                  <LabCard
                    key={lab.owner}
                    lab={lab}
                    avgRacks={labAvg.racks}
                    onSelect={setSelectedLab}
                    selected={selectedLab && selectedLab.owner === lab.owner}
                  />
                ))}
              </div>
              {filteredLabs.length === 0 && (
                <div className="detail-placeholder">조건에 맞는 연구실이 없습니다.</div>
              )}
            </div>
            {selectedLab ? (
              <LabDetailPanel
                lab={selectedLab}
                onClose={() => setSelectedLab(null)}
                avgRacks={labAvg.racks}
                avgServers={labAvg.servers}
              />
            ) : (
              <div className="detail-placeholder">연구실을 클릭하면 상세 정보가 여기에 표시됩니다.</div>
            )}
          </>
        ) : (
          <>
            <div>
              {ROOMS.map((room) => {
                const rows = slotRows.filter((r) => r.room === room);
                if (rows.length === 0) return null;
                return (
                  <div className="room-block" key={room}>
                    <div className="room-block-title">
                      {ROOM_META[room].full} · 후보 {rows.length}개 (
                      {rows.filter((r) => slotSelection.has(`${r.room}-${r.rackId}`)).length}개 선택됨)
                    </div>
                    <div className="slot-list">
                      {rows.map((r) => {
                        const key = `${r.room}-${r.rackId}`;
                        const checked = slotSelection.has(key);
                        const st = statusOf(r);
                        return (
                          <label
                            className={`slot-row ${checked ? "checked" : ""} ${r.shared ? "is-shared" : ""}`}
                            key={key}
                          >
                            <input type="checkbox" checked={checked} onChange={() => toggleSlot(key)} />
                            <span className="slot-rack-id mono">R{String(r.rackId).padStart(2, "0")}</span>
                            <span className="slot-owner">
                              <span className="slot-owner-name">
                                {r.shared && <span className="slot-shared-tag">공용</span>}
                                {r.labActual}
                              </span>
                              {r.items.length > 0 && (
                                <span className="slot-detail mono">{r.detail}</span>
                              )}
                            </span>
                            <span className="slot-status" style={{ color: STATUS_META[st].color }}>
                              {STATUS_META[st].label}
                            </span>
                            <span className="slot-servers mono">{r.serverCount > 0 ? `설치 ${r.serverCount}대` : "빈 랙"}</span>
                          </label>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
              {slotRows.length === 0 && (
                <div className="detail-placeholder">조건에 맞는 랙이 없습니다. "전체 랙 보기"를 눌러보세요.</div>
              )}
            </div>
            <div className="detail-panel">
              <div className="detail-title" style={{ marginBottom: 10 }}>확보 시나리오 요약</div>
              <div className="lab-detail-stats" style={{ marginBottom: 12 }}>
                <div>
                  <div className="lab-metric-big mono">{slotSummary.totalRacks}</div>
                  <div className="lab-metric-label">선택된 랙 수</div>
                </div>
                <div>
                  <div className="lab-metric-big mono">{slotSummary.displacedServers}</div>
                  <div className="lab-metric-label">이전 필요 서버 수</div>
                </div>
              </div>
              {ROOMS.map((room) => (
                <div className="detail-row" key={room}>
                  <span className="detail-row-type">
                    <span className="legend-dot" style={{ background: ROOM_COLOR[room] }} />
                    {room}
                  </span>
                  <span className="detail-row-count">
                    {slotSummary.byRoom[room].racks}랙
                    {slotSummary.byRoom[room].servers > 0 ? ` (이전 ${slotSummary.byRoom[room].servers}대)` : ""}
                  </span>
                </div>
              ))}
              {slotSummary.sharedRacks > 0 && (
                <div className="detail-note" style={{ marginTop: 12 }}>
                  🏛 학과 공용 랙 {slotSummary.sharedRacks}개를 회수 대상에 포함했습니다
                  {slotSummary.sharedServers > 0
                    ? ` (공용 서버 ${slotSummary.sharedServers}대 이전 필요).`
                    : "."}{" "}
                  공용 자원 회수는 학과 차원의 합의가 필요한 항목입니다.
                </div>
              )}
              <div className="detail-note" style={{ marginTop: 12 }}>
                💡 체크박스로 랙을 켜고 끄면서 신규 연구실 배정 시나리오를 자유롭게 계산해보세요. 기본값은 이미 "회수 완료"로 표시된 랙과 빈 랙이며, 학과 공용 랙은 후보로만 표시되고 기본 선택되지 않습니다.
              </div>
            </div>
          </>
        )}
      </div>

      <div className="footnote">
        DATA SOURCE: 서버실_현황.xlsx (연구실 설문 취합) — 일부 연구실(최윤재 등) 세부 사양 미기재. 신기정/James/이기민 명의 랙은 실사용자(주재걸/신진우) 기준으로 표기.
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<GPUDashboard />);
</script>
</body>
</html>
