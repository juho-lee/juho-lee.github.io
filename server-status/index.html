<style>
  html, body { margin: 0; padding: 0; background: #0A0C10; }
  #root { min-height: 100vh; }
  .boot {

    text-align: center; padding: 80px 20px; font-size: 14px;
  }
  .workspace-lock { border:0; padding:0; margin:0; min-width:0; }
  .workspace-lock:disabled { opacity:0.5; }
  .rack-edit-toolbar { max-width:1180px; margin:0 auto 18px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:13px; color:var(--text-muted); }
  .edit-note { flex-basis:100%; line-height:1.6; }
  .server-handles { user-select:none; display:flex; flex-wrap:wrap; gap:4px; border-top:1px solid var(--border); padding-top:8px; }
  .server-handle { border:1px solid var(--border); border-radius:4px; background:var(--panel); color:var(--text); font:inherit; font-size:10px; padding:4px; cursor:grab; }
  .server-handle.active { outline:2px solid var(--c-occupied); }
  .server-handles > span { flex-basis:100%; }
  .migration-loader { flex-basis:100%; display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding-top:12px; border-top:1px solid var(--border); font-size:13px; color:var(--text-muted); }
  .migration-loader select { min-width:0; max-width:100%; padding:8px; border:1px solid var(--border); border-radius:6px; background:var(--panel); color:var(--text); font:inherit; }
  .migration-loader a { text-decoration:none; }
  .migration-loader > span { flex-basis:100%; line-height:1.5; }
  .workspace-toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; max-width:1180px; margin:0 auto 24px; }
  .workspace-toolbar [role] { flex-basis:100%; font-size:13px; color:var(--text-muted); line-height:1.5; }
  .workspace-toolbar .chip { display:inline-flex; align-items:center; justify-content:center; min-height:36px; margin:0; line-height:1.5; }
  .workspace-toolbar .file-import { position:relative; }
  .workspace-toolbar .file-import input { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; border:0; }
  .workspace-toolbar .file-import:focus-within { outline:2px solid var(--c-occupied); outline-offset:3px; }
  .editor-overlay { position:fixed; inset:0; z-index:100; background:#0009; display:flex; align-items:center; justify-content:center; padding:16px; }
  .editor-panel { color:var(--text); background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:24px; width:620px; max-width:100%; max-height:85vh; overflow:auto; box-sizing:border-box; }
  .editor-panel label { display:block; margin:12px 0; font-size:14px; }
  .editor-panel input:not([type=checkbox]), .editor-panel select, .editor-panel textarea { display:block; box-sizing:border-box; width:100%; margin-top:6px; padding:9px; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:5px; font:inherit; }
  .editor-panel button { padding:9px 14px; cursor:pointer; }
  .editor-panel p { font-size:13px; line-height:1.6; }
  .editor-item { display:flex; gap:10px; align-items:center; border-bottom:1px solid var(--border); }
  .editor-item label { flex:1; min-width:0; }
  .editor-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:24px; }
  .editor-panel fieldset { border:1px solid var(--border); margin-top:16px; }
</style>

const PLAN_STORAGE_KEY = "gpuDashboardSlotPlans_v1";
const CODE_TO_ROOM = Object.fromEntries(
  Object.entries(ROOM_META).map(([room, m]) => [m.code, room])
);

// 선택된 랙 키("홍릉-25") 집합 → URL용 짧은 코드 문자열("HR25-YJ6-…")
function encodePlan(keys) {
  return Array.from(keys)
    .map((k) => {
      const [room, id] = k.split("-");
      const code = ROOM_META[room] ? ROOM_META[room].code : null;
      return code ? `${code}${id}` : null;
    })
    .filter(Boolean)
    .sort()
    .join("-");
}

// 코드 문자열 → 랙 키 배열 (알 수 없는 토큰은 무시)
function decodePlan(str) {
  const keys = [];
  if (!str) return keys;
  str.split("-").forEach((tok) => {
    const m = /^([A-Z]{2})(\d+)$/.exec(tok);
    if (!m) return;
    const room = CODE_TO_ROOM[m[1]];
    if (room) keys.push(`${room}-${m[2]}`);
  });
  return keys;
}
let ROOM_CAPACITY = {
  "홍릉": { coolingKW: 316, rackCount: 25, kwPerRack: 12.64, maxServersPerRack: 4 },
  "양재": { coolingKW: 560, rackCount: 32, kwPerRack: 17.5, maxServersPerRack: 6 },

// 개별 교수 배정분 합계 (학과 공용·인프라 제외) — 기존 교원 잔여 자원 계산용
// ※ 반드시 ROOM_CAPACITY 뒤에 위치 (즉시 실행 IIFE, TDZ 주의)
function individualTotals() {
  let racks = 0, slots = 0, physical = 0;
  RACK_DATA.forEach((r) => {
    if (r.infra || r.shared) return;
    racks += 1;
    const cap = ROOM_CAPACITY[r.room];
    if (cap) slots += cap.maxServersPerRack;
    physical += PHYSICAL_SLOTS_PER_RACK;
  });
  return { racks, slots, physical };
}
let DEPT_INDIVIDUAL = individualTotals();

// 랙 부하 수준: 권장 최대 대비 현재 서버 수
function rackLoad(r) {
  const cap = ROOM_CAPACITY[r.room];
  if (!cap || r.infra || r.serverCount <= 0) {
    return { level: "none", ratio: 0, max: cap ? cap.maxServersPerRack : 0 };
  }
  const ratio = r.serverCount / cap.maxServersPerRack;
  let level = "ok";
  if (ratio > 1) level = "over";
  else if (ratio >= 0.8) level = "near";
  return { level, ratio, max: cap.maxServersPerRack };
}

function aggregateByOwner() {
  const map = {};
  RACK_DATA.forEach((r) => {
    if (r.shared || r.infra) return;
    const key = r.labActual;
    if (!map[key]) {
      map[key] = { owner: key, totalRacks: 0, totalServers: 0, totalSlots: 0, totalPhysical: 0, byRoom: {}, flags: new Set(), nominals: new Set() };
    }
    const o = map[key];
    o.totalRacks += 1;
    o.totalServers += r.serverCount;
    o.totalSlots += (ROOM_CAPACITY[r.room] && ROOM_CAPACITY[r.room].maxServersPerRack) || 0;
    o.totalPhysical += PHYSICAL_SLOTS_PER_RACK;
    o.byRoom[r.room] = o.byRoom[r.room] || { racks: 0, servers: 0 };
    o.byRoom[r.room].racks += 1;
    o.byRoom[r.room].servers += r.serverCount;
    if (r.labNominal !== r.labActual) o.nominals.add(r.labNominal);
    if (statusOf(r) === "reclaim") o.flags.add("reclaim");
    if (statusOf(r) === "empty") o.flags.add("empty");
  });
  return Object.values(map);
}

  const item = from && from.items[source.itemIndex];
  if (!item || item.type !== "server" || !Number.isInteger(source.unit) || source.unit < 0 || source.unit >= item.count) return racks;
  const to = target && next.find(r => r.room === target.room && r.rackId === target.rackId);
  if (target && (!to || to.infra || to === from)) return racks;
  if (from.infra) return racks;
  // Resolve legacy rack-level ownership before mixing servers from different labs.
  for (const rack of [from, to].filter(Boolean)) {
    rack.items.forEach(i => { if (i.type === "server") { if (!i.owner) i.owner = rack.labActual; if (!i.origin) i.origin = {room:rack.room,rackId:rack.rackId,rackMappingVerified:true}; } });
  }
  if (to) {
    to.items.push({...item, count:1});
    to.reclaimable = false;
  }
  item.count -= 1;
  if (!item.count) from.items.splice(source.itemIndex,1);
  for (const r of next) {
    r.serverCount = r.items.filter(i => i.type === "server").reduce((n,i) => n+i.count,0);
    r.empty = r.items.length === 0;
    r.detail = r.items.map(i => `${i.type === "server" ? i.size || "?U" : i.type} x ${i.count}`).join(", ") || "0";
  }
  for (const rack of [from, to].filter(Boolean)) {
    const owners = [...new Set(rack.items.filter(i => i.type === "server").map(i => i.owner))];
    if (owners.length) {
      rack.labActual = owners.join(" / ");
      rack.shared = owners.every(owner => owner === "학과 공용");
    } else if (rack.empty) {
      rack.labActual = "미배정";
      rack.shared = false;
    }

}

let LEGACY_WORKSPACE_BACKUP = null;
let ACTIVE_BASELINE_REVISION = BASELINE_REVISION;
let ACTIVE_MIGRATION = null;
let ACTIVE_REPORT_BASELINE = DEFAULT_REPORT_BASELINE;
let ACTIVE_PLANS = null;
const WORKSPACE_KEY = "gpuDashboardWorkspace_v1";
const clone = value => JSON.parse(JSON.stringify(value));
function snapshot(plans = []) {
  return clone({ format: "gpu-server-status", version: 1, baselineRevision:ACTIVE_BASELINE_REVISION, savedAt: new Date().toISOString(), racks: RACK_DATA,
    settings: { rooms: ROOM_CAPACITY, serverKW: SERVER_KW, physicalSlots: PHYSICAL_SLOTS_PER_RACK,
      facultyCurrent: FACULTY_CURRENT, faculty2026: FACULTY_NEW_2026, faculty2027: FACULTY_NEW_2027 }, plans, ...(ACTIVE_MIGRATION ? {migration: ACTIVE_MIGRATION} : {}), ...(ACTIVE_REPORT_BASELINE ? {reportBaseline: ACTIVE_REPORT_BASELINE} : {}) });
}
const INITIAL_WORKSPACE = snapshot();
function normalizeWorkspace(input) {
  const fail = message => { throw new Error(message); };
  if (!input || input.format !== "gpu-server-status" || input.version !== 1) fail("지원하는 현황 JSON 형식(버전 1)이 아닙니다.");
  const data = clone(input);
  if (data.migration && data.migration.baselineRevision !== BASELINE_REVISION) fail("추가 폐기를 가정한 이전 기준 플랜입니다. 최신 A/B/C 플랜을 다시 불러오세요.");
  if (data.reportBaseline != null && (!Array.isArray(data.reportBaseline) || data.reportBaseline.some(r => !r || typeof r.room !== "string" || !Number.isSafeInteger(r.rackId) || typeof r.labActual !== "string" || (r.allocationCategory != null && !Object.hasOwn(GPUReport.categories,r.allocationCategory))))) fail("보고서 기준 배정 정보가 올바르지 않습니다.");
  const positive = n => typeof n === "number" && Number.isFinite(n) && n > 0;
  const text = v => typeof v === "string" && v.trim().length > 0;
  const keys = new Set();
  if (!Array.isArray(data.racks) || data.racks.length !== INITIAL_WORKSPACE.racks.length) fail("랙 수가 초기 현황과 다릅니다.");
  const validKeys = new Set(INITIAL_WORKSPACE.racks.map(r => `${r.room}-${r.rackId}`));
  data.racks.forEach(r => {
    const key = `${r.room}-${r.rackId}`;
    if (!validKeys.has(key) || keys.has(key)) fail("알 수 없거나 중복된 랙이 있습니다.");
    keys.add(key);
    if (!text(r.labNominal) || !text(r.labActual) || !Array.isArray(r.items)) fail("배정 명의, 실사용자와 장비 목록을 확인하세요.");
    if (![r.shared,r.infra,r.reclaimable].every(v => typeof v === "boolean") || (r.shared && r.infra)) fail("랙 상태를 확인하세요.");
    if (r.allocationCategory != null && !Object.hasOwn(GPUReport.categories,r.allocationCategory)) fail("보고서 배정 분류를 확인하세요.");
    if (r.note != null && typeof r.note !== "string") fail("비고는 문자열이어야 합니다.");
    r.items.forEach(i => { if (!text(i.type) || !Number.isSafeInteger(i.count) || i.count < 1 || (i.size != null && typeof i.size !== "string") || (i.owner != null && !text(i.owner))) fail("장비 종류와 1 이상의 정수 수량을 입력하세요."); });
    const ownedServers = r.items.filter(i => i.type === "server");
    if (ownedServers.length && ownedServers.every(i => i.owner)) {
      const owners = [...new Set(ownedServers.map(i => i.owner))];
      r.labActual = owners.join(" / ");
      r.shared = !r.infra && owners.every(owner => owner === "학과 공용");
    }
    r.serverCount = r.items.filter(i => i.type === "server").reduce((n,i) => n+i.count,0);
    r.empty = r.items.length === 0;
    r.detail = r.items.map(i => `${i.type === "server" ? i.size || "?U" : i.type} x ${i.count}`).join(", ") || "0";
  });
  const c = data.settings;
  if (!c || ![c.serverKW,c.physicalSlots,c.facultyCurrent,c.faculty2026,c.faculty2027].every(positive)) fail("계산 설정은 0보다 큰 숫자여야 합니다.");
  if (![c.physicalSlots,c.facultyCurrent,c.faculty2026,c.faculty2027].every(Number.isSafeInteger)) fail("물리 슬롯과 교원 수는 정수여야 합니다.");
  ROOMS.forEach(room => {
    const cap = c.rooms && c.rooms[room];
    if (!cap || ![cap.coolingKW,cap.maxServersPerRack].every(positive)) fail(`${room} 냉방·권장 슬롯 설정을 확인하세요.`);
    cap.rackCount = data.racks.filter(r => r.room === room).length;
    cap.kwPerRack = cap.coolingKW / cap.rackCount;
  });
  if (!Array.isArray(data.plans)) fail("계획 목록이 올바르지 않습니다.");
  const names = new Set();
  data.plans.forEach(p => {
    if (!text(p.name) || names.has(p.name) || !Array.isArray(p.keys) || !p.keys.every(k => keys.has(k)) || !Number.isFinite(p.ts)) fail("계획 이름, 랙 또는 저장 시각이 올바르지 않습니다.");
    names.add(p.name); p.keys = [...new Set(p.keys)];
  });
  return data;
}
function applyWorkspace(data) {
  ACTIVE_BASELINE_REVISION = data.baselineRevision || "legacy";
  ACTIVE_MIGRATION = data.migration ? clone(data.migration) : null;
  ACTIVE_REPORT_BASELINE = data.reportBaseline ? clone(data.reportBaseline) : null;
  ACTIVE_PLANS = clone(data.plans);
  RACK_DATA = clone(data.racks); ROOM_CAPACITY = clone(data.settings.rooms);
  SERVER_KW = data.settings.serverKW; PHYSICAL_SLOTS_PER_RACK = data.settings.physicalSlots;
  FACULTY_CURRENT = data.settings.facultyCurrent; FACULTY_NEW_2026 = data.settings.faculty2026; FACULTY_NEW_2027 = data.settings.faculty2027;
  DEPT_INDIVIDUAL = individualTotals();
}
function saveWorkspace(plans) {
  localStorage.setItem(WORKSPACE_KEY, JSON.stringify(snapshot(plans)));
}
function Workspace() {
  const [state, setState] = useState(() => {
    let restoredRaw = null;
    try {
      const raw = localStorage.getItem(WORKSPACE_KEY); restoredRaw = raw;
      if (raw) { const data = normalizeWorkspace(JSON.parse(raw)); applyWorkspace(data); localStorage.setItem(PLAN_STORAGE_KEY, JSON.stringify(data.plans)); }
      return { revision: 0, message: raw ? (ACTIVE_BASELINE_REVISION === BASELINE_REVISION ? "브라우저 임시 저장 복원됨" : "이전 기준의 브라우저 현황 복원됨 · 기본 현황과 다를 수 있습니다. 필요하면 JSON 백업 후 초기 현황 복원") : "2026-10-28 기준 현황 · 홍릉 8–13번 서버 폐기 반영 · 추가 폐기 없음" };
    } catch (e) {
      if (restoredRaw) {
        LEGACY_WORKSPACE_BACKUP = restoredRaw;
        try { if(!localStorage.getItem("gpuDashboardWorkspace_legacyBackup")) localStorage.setItem("gpuDashboardWorkspace_legacyBackup",restoredRaw); } catch (_) {}
      }
      return { revision: 0, message: `이전 현황을 적용하지 않고 최신 기준 현황을 표시합니다: ${e.message} 기존 데이터는 이전 임시현황 백업 버튼으로 보관할 수 있습니다.` };
    }
  });
  const commit = input => {
    let data;
    try { data = normalizeWorkspace(input); } catch (e) { window.alert(e.message); return; }
    applyWorkspace(data);
    let message = "브라우저에 임시 저장됨 · 다른 머신으로 이동 시 JSON을 내보내세요";
    try { saveWorkspace(data.plans); localStorage.setItem(PLAN_STORAGE_KEY, JSON.stringify(data.plans)); }
    catch (e) { message = "브라우저 저장 실패 · 작업을 유지하려면 JSON을 내보내세요"; }
    // Remount derived views so every aggregate and selection uses the new snapshot.
    window.history.replaceState(null, "", window.location.pathname + window.location.search);
    setState(s => ({ revision: s.revision + 1, message }));
  };
  return <GPUDashboard key={state.revision} onCommit={commit} storageMessage={state.message} />;
}
const MIGRATION_PLANS = [
  {file:"01-priority1-partial.json",label:"A · 1순위 8랙 · 55대 이전 / 23대 잔류"},
  {file:"02-priority2-partial.json",label:"B · 2순위까지 11랙 · 67대 이전 / 11대 잔류"},
  {file:"03-priority3-partial.json",label:"C · 3순위까지 12랙 · 71대 이전 / 7대 잔류"},
];
function WorkspaceToolbar({ plans, onCommit, message, onSettings }) {
  const [error,setError] = useState("");
  const [planFile,setPlanFile] = useState(MIGRATION_PLANS[0].file);
  const [loading,setLoading] = useState(false);
  const loadMigrationPlan = async () => {
    setLoading(true); setError("");
    try {
      const selectedPlan = MIGRATION_PLANS.find(plan => plan.file === planFile);
      if (!selectedPlan) throw new Error("플랜을 선택하세요.");
      const response = await fetch(new URL(`plans/${selectedPlan.file}`, window.location.href), {cache:"no-store"});
      if (!response.ok) throw new Error(`플랜을 가져올 수 없습니다 (${response.status}).`);
      const data = normalizeWorkspace(await response.json());
      if (window.confirm(`${selectedPlan.label}\n\n홍릉 8–13번 서버 폐기가 반영된 기준이며 추가 폐기는 없습니다. 실제 U·전원 용량 미검증의 조건부 계획입니다.\n현재 현황·설정·저장 계획을 교체할까요? 필요한 경우 먼저 JSON을 내보내세요.`)) onCommit(data);
    } catch(e) { setError(`플랜 불러오기 실패: ${e.message}`); }
    finally { setLoading(false); }
  };
  const reportData = () => GPUReport.build(snapshot(plans));
  const exportReport = () => {
    const content = GPUReport.markdown(reportData());
    const url = URL.createObjectURL(new Blob([content],{type:"text/markdown;charset=utf-8"}));
    const link=document.createElement("a"); link.href=url; link.download=`migration-report-${new Date().toISOString().slice(0,10)}.md`; link.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
  };
  const printReport = () => {
    const content=GPUReport.printable(reportData());
    const reportWindow=window.open("","_blank");
    if(!reportWindow) { setError("보고서 창을 열 수 없습니다. 팝업을 허용하거나 Markdown으로 내려받으세요."); return; }
    reportWindow.opener=null;
    reportWindow.document.open(); reportWindow.document.write(content); reportWindow.document.close();
  };
  const exportJSON = () => {
    const url = URL.createObjectURL(new Blob([JSON.stringify(snapshot(plans), null, 2)], { type: "application/json" }));
    const a = document.createElement("a"); a.href = url; a.download = `server-status-${new Date().toISOString().replace(/[:.]/g,"-")}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(url),1000);
  };
  const importJSON = async event => {
    const file = event.target.files[0]; event.target.value = ""; if (!file) return;
    try {
      if (file.size > 5 * 1024 * 1024) throw new Error("5MB 이하의 JSON 파일을 선택하세요.");
      const data = normalizeWorkspace(JSON.parse(await file.text()));
      if (window.confirm(`${data.racks.length}개 랙과 ${data.plans.length}개 계획을 불러옵니다. 현재 현황·설정·저장 계획을 교체할까요? 필요한 경우 먼저 JSON을 내보내세요.`)) onCommit(data);
      setError("");
    } catch(e) { setError(`불러오기 실패: ${e.message}`); }
  };
  return <div className="workspace-toolbar">
    <button className="chip" onClick={exportJSON}>JSON 내보내기</button>
    {LEGACY_WORKSPACE_BACKUP && <button className="chip" onClick={() => {
      const url=URL.createObjectURL(new Blob([LEGACY_WORKSPACE_BACKUP],{type:"application/json"}));
      const link=document.createElement("a"); link.href=url; link.download="server-status-legacy-backup.json"; link.click(); setTimeout(()=>URL.revokeObjectURL(url),1000);
    }}>이전 임시현황 백업 (JSON)</button>}
    <label className="chip file-import">JSON 불러오기<input aria-label="JSON 불러오기" type="file" accept=".json,application/json" onChange={importJSON} /></label>
    <button className="chip" onClick={onSettings}>계산 설정</button>
    <button className="chip" onClick={exportReport}>현재 현황 보고서 (MD)</button>
    <button className="chip" onClick={printReport}>보고서 인쇄 / PDF</button>
    <button className="chip" onClick={() => { if(window.confirm("현황·계산 설정·저장 계획을 초기 상태로 되돌릴까요? 필요한 경우 먼저 JSON을 내보내세요.")) onCommit(clone(INITIAL_WORKSPACE)); }}>초기 현황 복원</button>
    <div className="migration-loader">
      <label htmlFor="migration-plan">대전 이전 플랜</label>
      <select id="migration-plan" value={planFile} disabled={loading} onChange={e => setPlanFile(e.target.value)}>
        {MIGRATION_PLANS.map(plan => <option key={plan.file} value={plan.file}>{plan.label}</option>)}
      </select>
      <button className="chip" disabled={loading} onClick={loadMigrationPlan}>{loading ? "불러오는 중…" : "플랜 불러오기"}</button>
      <a className="chip" href="plans/migration-report.md" target="_blank" rel="noopener noreferrer">배치·가정 보고서</a>
      <span>2026-10-28 수정 기준 · 추가 폐기 없음 · 실제 U·전원 미검증 · 불러오면 현재 현황을 교체합니다.</span>
    </div>
    <div role="status">{message}</div>{error && <div role="alert">{error}</div>}
  </div>;
}
function EditorShell({ title, onClose, onSubmit, children }) {
  return <div className="editor-overlay"><form className="editor-panel" role="dialog" aria-modal="true" aria-label={title} onSubmit={e => { e.preventDefault(); onSubmit(); }}>
    <h2>{title}</h2>{children}<div className="editor-actions"><button type="button" onClick={onClose}>취소</button><button type="submit">변경사항 저장</button></div>
  </form></div>;
}
function RackEditor({ rack, onClose, onSave }) {
  const [draft,setDraft] = useState(() => clone(rack));
  const update = (key,value) => setDraft(d => ({...d,[key]:value}));
  const itemUpdate = (index,key,value) => update("items",draft.items.map((it,i) => i === index ? {...it,[key]:value} : it));
  return <EditorShell title={`${rack.room} R${rack.rackId} 수정`} onClose={onClose} onSubmit={() => onSave(draft)}>
    <label>배정 명의<input required value={draft.labNominal} onChange={e => update("labNominal",e.target.value)} /></label>
    <label>실사용 연구실<input required value={draft.labActual} onChange={e => {
      const name = e.target.value;
      setDraft(d => ({...d,labActual:name,items:d.items.map(i => i.type === "server" ? {...i,owner:name} : i)}));
    }} /></label>
    <label>보고서 배정 분류<select value={draft.allocationCategory || GPUReport.classify(draft, ACTIVE_REPORT_BASELINE?.find(r => r.room === draft.room && r.rackId === draft.rackId))} onChange={e => update("allocationCategory",e.target.value)}>
      {Object.entries(GPUReport.categories).map(([value,label]) => <option key={value} value={value}>{label}</option>)}
    </select></label>
    <p>빈 랙의 배정 상태와 임시 점유 분류에 사용합니다. 예약이 확인된 랙만 신임교원 예약으로 지정하세요.</p>
    <label>용도<select value={draft.infra ? "infra" : draft.shared ? "shared" : "lab"} onChange={e => setDraft(d => ({...d,infra:e.target.value === "infra",shared:e.target.value === "shared"}))}><option value="lab">개별 연구실</option><option value="shared">학과 공용</option><option value="infra">인프라</option></select></label>
    <label><input type="checkbox" checked={draft.reclaimable} onChange={e => update("reclaimable",e.target.checked)} /> 회수 가능</label>
    <h3>설치 장비</h3><p>장비가 없으면 빈 랙으로 표시합니다. 서버 수는 server 장비 수량으로 계산합니다.</p>
    {draft.items.map((it,i) => <div className="editor-item" key={i}>
      <label>종류<select value={it.type} onChange={e => itemUpdate(i,"type",e.target.value)}>{[...new Set(["server","Master","Storage","Nas","Hub","Desktop","Terminal",it.type])].map(t => <option key={t}>{t}</option>)}</select></label>
      {it.type === "server" && <label>소유자<input required value={it.owner || draft.labActual} onChange={e => itemUpdate(i,"owner",e.target.value)} /></label>}
      <label>크기<input placeholder="4U / ?U" value={it.size || ""} onChange={e => itemUpdate(i,"size",e.target.value || null)} /></label>
      <label>수량<input required type="number" min="1" step="1" value={it.count} onChange={e => itemUpdate(i,"count",Number(e.target.value))} /></label>
      <button type="button" onClick={() => update("items",draft.items.filter((_,j) => i !== j))}>삭제</button>
    </div>)}
    <button type="button" onClick={() => update("items",[...draft.items,{type:"server",size:"?U",count:1,owner:draft.labActual}])}>장비 추가</button>
    <label>비고<textarea value={draft.note || ""} onChange={e => update("note",e.target.value)} /></label>
  </EditorShell>;
}
function SettingsEditor({ onClose, onSave }) {
  const [draft,setDraft] = useState(() => snapshot().settings);
  const field = (label,key,step="1") => <label>{label}<input required type="number" min={step} step={step} value={draft[key]} onChange={e => setDraft(d => ({...d,[key]:Number(e.target.value)}))} /></label>;
  return <EditorShell title="계산 설정" onClose={onClose} onSubmit={() => onSave(draft)}>
    {field("서버 1대 전력 가정 (kW)","serverKW","0.1")}{field("랙당 물리 슬롯","physicalSlots")}{field("기존 교원 수","facultyCurrent")}{field("2026 신임 교원 수","faculty2026")}{field("2027 신임 교원 수","faculty2027")}
    {ROOMS.map(room => <fieldset key={room}><legend>{room}</legend>{[["coolingKW","냉방 용량 (kW)"],["maxServersPerRack","랙당 권장 슬롯"]].map(([key,label]) => <label key={key}>{label}<input required type="number" min="0.1" step="0.1" value={draft.rooms[room][key]} onChange={e => setDraft(d => ({...d,rooms:{...d.rooms,[room]:{...d.rooms[room],[key]:Number(e.target.value)}}}))} /></label>)}</fieldset>)}
    <p>권장 슬롯은 직접 지정하는 계획값입니다. 냉방 용량을 바꿔도 자동 변경되지 않습니다.</p>
  </EditorShell>;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Workspace />);
</script>
